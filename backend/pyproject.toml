[project]
name = "scrub-backend"
version = "0.2.0"
description = "Scrub+ v2 backend: agent router, scans, rules."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "boto3>=1.35",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
