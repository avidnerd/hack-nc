<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrub+ — sterile surgical planning console</title>
    <meta
      name="description"
      content="A webcam-driven, voice-first 3D surgical planning console that runs entirely in the browser."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080c'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%2358e5c8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- The ray-marcher draws here; everything else is DOM on top of it. -->
    <canvas id="stage"></canvas>

    <!-- Boot screen. Removed once the first case is on the GPU. -->
    <div id="loader" class="loader">
      <div class="wordmark" aria-label="Scrub Plus">
        <span class="wm-scrub">SCRUB</span><span class="wm-plus">+</span>
      </div>
      <div class="loader-sub">Sterile surgical planning console</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-label" id="loader-label">Starting</div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <div class="tb-left">
        <span class="case-name" id="case-name">—</span>
        <span class="mode-badge" id="mode-badge">SURGEON</span>
      </div>
      <div class="tb-right">
        <div class="status" id="hand-status" title="Hand tracking">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <path
              d="M7 11V5.5a1.5 1.5 0 0 1 3 0V11m0 0V4.5a1.5 1.5 0 0 1 3 0V11m0 0V5.5a1.5 1.5 0 0 1 3 0V13m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-6-6v-3.2a1.4 1.4 0 0 1 2.8 0V13"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="dot" id="hand-l" title="Left hand"></span>
          <span class="dot" id="hand-r" title="Right hand"></span>
        </div>
        <div class="status" id="mic-status" title="Voice">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <path
              d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Zm-7 9a7 7 0 0 0 14 0M12 19v2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </header>

    <!-- Numbers panel -->
    <aside class="numbers" id="numbers"></aside>

    <!-- Patient-mode callouts, hidden in surgeon mode -->
    <aside class="callouts" id="callouts" hidden></aside>

    <!-- Bottom: transcript + response -->
    <footer class="bottombar">
      <div class="transcript" id="transcript"></div>
      <div class="response" id="response"></div>
    </footer>

    <!-- Webcam preview with landmark dots -->
    <div class="camwrap" id="camwrap">
      <video id="cam" playsinline muted></video>
      <canvas id="camoverlay"></canvas>
      <div class="pose-badge" id="pose-badge">IDLE</div>
    </div>

    <!-- Toast stack -->
    <div class="toasts" id="toasts"></div>

    <!-- Banner for webcam/mic failures -->
    <div class="banner" id="banner" hidden></div>

    <!-- Help overlay, toggled with ? -->
    <div class="help" id="help" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
